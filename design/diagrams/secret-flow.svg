<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d">
<title id="t">Secret layer state flow: walker-2d-dynamic-tilemap-layers</title>
<desc id="d">Secret TileMapLayer: SOLID-LOOKING (alpha 1, idle) → FADING OUT → FADED (alpha 0.3, idle) → FADING IN → back. Collision is always off. Dashed: reward behind wall, not in code. M-03, M-04, S-02.</desc>
