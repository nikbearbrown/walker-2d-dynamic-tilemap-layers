<g font-size="13" text-anchor="middle" fill="#5b6b7c"><text x="200" y="218">alpha 1.0 · process off</text><text x="700" y="218">move_toward 0.3 at 1/s</text><text x="1200" y="218">alpha 0.3 · process off</text><text x="700" y="418">move_toward 1.0 at 1/s</text></g>
<g stroke="#25354a" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M350 200 H540"/><path d="M850 200 H1040"/><path d="M1200 252 Q1100 400 860 400"/><path d="M540 400 Q300 400 200 262"/></g>
