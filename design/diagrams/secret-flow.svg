<text x="40" y="50" font-size="30" font-weight="700">Secret layer · S-02</text>
<text x="40" y="78" font-size="15" fill="#5b6b7c">solid = observed (level/tile_map.gd) · collision polygons = 0 on every Secret tile, always · dashed = proposed</text>
<g stroke="#25354a" stroke-width="2.5" fill="#fffdf7">
<ellipse cx="200" cy="200" rx="150" ry="52"/><ellipse cx="700" cy="200" rx="150" ry="52"/><ellipse cx="1200" cy="200" rx="150" ry="52"/><ellipse cx="700" cy="400" rx="150" ry="52"/>
</g>
